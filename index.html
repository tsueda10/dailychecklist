
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お出かけ前チェック</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont,
      "Helvetica Neue", sans-serif;
    background: #f5f7fa;
    color: #253246;
    margin: 0;
    padding: 24px;
  }
  .app {
    max-width: 460px;
    margin: 35px auto;
    background: white;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 5px 25px #0000000c;
  }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .description, .date { color: #687385; font-size: 14px; }
  .date { margin: 20px 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border: 1px solid #e0e5ed;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .item.checked {
    background: #eef9f2;
    border-color: #83c99c;
  }
  .item input[type="checkbox"] {
    width: 23px;
    height: 23px;
    accent-color: #26985a;
    cursor: pointer;
    flex-shrink: 0;
  }
  .item-label {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .item-title {
    font-size: 16px;
    overflow-wrap: anywhere;
  }
  .checked-time {
    font-size: 12px;
    color: #23834c;
    margin-top: 5px;
  }
  .delete-btn {
    width: auto;
    background: transparent;
    border: none;
    color: #a0a8b5;
    font-size: 20px;
    cursor: pointer;
    padding: 5px 8px;
  }
  .delete-btn:hover { color: #d44343; }
  .status {
    text-align: center;
    margin: 24px 0 16px;
    font-weight: 600;
    color: #536174;
  }
  .reset-btn {
    width: 100%;
    padding: 13px;
    background: white;
    border: 1px solid #d3dae4;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .add-section {
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid #e0e5ed;
  }
  .add-section h2 { font-size: 17px; }
  .add-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .add-form input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #d3dae4;
    border-radius: 9px;
    font-size: 15px;
  }
  .add-btn {
    background: #26985a;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 0 17px;
    cursor: pointer;
    font-size: 14px;
  }
  .add-btn:hover { background: #1c7c48; }
  .hint {
    font-size: 12px;
    color: #8b95a3;
    margin-top: 10px;
  }
</style>
</head>
<body>
<main class="app">
  <h1>🏠 お出かけ前チェック</h1>
  <p class="description">確認できた項目にチェックを入れてください。</p>
  <div class="date" id="date"></div>

  <div id="checklist"></div>

  <div class="status" id="status"></div>
  <button class="reset-btn" id="reset">チェックをすべて外す</button>

  <section class="add-section">
    <h2>＋ チェック項目を追加</h2>
    <form class="add-form" id="addForm">
      <input
        id="newItem"
        type="text"
        placeholder="例：エアコンの電源OFF"
        maxlength="60"
        required
      >
      <button class="add-btn" type="submit">追加</button>
    </form>
    <p class="hint">追加した項目は自動保存されます。</p>
  </section>
</main>

<script>
  const STORAGE_KEY = "daily-check-v3";

  const defaultItems = [
    { id: "key", name: "🔑 鍵の施錠", time: null, custom: false },
    { id: "window", name: "🪟 窓の施錠", time: null, custom: false },
    { id: "light", name: "💡 部屋の消灯", time: null, custom: false }
  ];

  const today = () => {
    const d = new Date();
    return [
      d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, "0"),
      String(d.getDate()).padStart(2, "0")
    ].join("-");
  };

  let items = [];
  let currentDate = today();

  function formatTime(iso) {
    return new Date(iso).toLocaleString("ja-JP", {
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hour12: false
    });
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      date: currentDate,
      items
    }));
  }

  function load() {
    let data = null;
    try {
      data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (_) {}

    if (data && Array.isArray(data.items)) {
      items = data.items;
      if (data.date !== today()) {
        items.forEach(item => item.time = null);
      }
    } else {
      items = defaultItems.map(item => ({ ...item }));
    }

    currentDate = today();
    save();
    render();
  }

  function checkDate() {
    if (currentDate !== today()) {
      currentDate = today();
      items.forEach(item => item.time = null);
      save();
      render();
    }
  }

  function render() {
    document.getElementById("date").textContent =
      new Date().toLocaleDateString("ja-JP", {
        year: "numeric", month: "long",
        day: "numeric", weekday: "long"
      });

    const list = document.getElementById("checklist");
    list.replaceChildren();

    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "item" + (item.time ? " checked" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = "check-" + item.id;
      checkbox.checked = Boolean(item.time);
      checkbox.addEventListener("change", () => {
        checkDate();
        const target = items.find(x => x.id === item.id);
        if (!target) return;
        target.time = checkbox.checked
          ? new Date().toISOString() : null;
        save();
        render();
      });

      const label = document.createElement("label");
      label.className = "item-label";
      label.htmlFor = checkbox.id;

      const title = document.createElement("div");
      title.className = "item-title";
      title.textContent = item.name;
      label.appendChild(title);

      if (item.time) {
        const time = document.createElement("div");
        time.className = "checked-time";
        time.textContent = "✓ 確認日時：" + formatTime(item.time);
        label.appendChild(time);
      }

      row.appendChild(checkbox);
      row.appendChild(label);

      if (item.custom) {
        const del = document.createElement("button");
        del.className = "delete-btn";
        del.type = "button";
        del.textContent = "×";
        del.title = "この項目を削除";
        del.setAttribute("aria-label", item.name + "を削除");
        del.addEventListener("click", () => {
          if (confirm("「" + item.name + "」を削除しますか？")) {
            items = items.filter(x => x.id !== item.id);
            save();
            render();
          }
        });
        row.appendChild(del);
      }

      list.appendChild(row);
    });

    const count = items.filter(item => Boolean(item.time)).length;
    const status = document.getElementById("status");
    status.textContent = count === items.length && items.length > 0
      ? "✅ すべてチェック済みです"
      : `${count} / ${items.length} 項目チェック済み`;
    status.style.color =
      count === items.length && items.length > 0
        ? "#26985a" : "#536174";
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    checkDate();
    const input = document.getElementById("newItem");
    const name = input.value.trim();
    if (!name) return;

    items.push({
      id: "custom-" + Date.now() + "-" +
        Math.random().toString(36).slice(2),
      name,
      time: null,
      custom: true
    });

    input.value = "";
    save();
    render();
    input.focus();
  });

  document.getElementById("reset").addEventListener("click", () => {
    checkDate();
    items.forEach(item => item.time = null);
    save();
    render();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) checkDate();
  });

  window.addEventListener("focus", checkDate);
  setInterval(checkDate, 30000);

  load();
</script>
</body>
</html>
